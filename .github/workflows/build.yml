name: Build & Release Simply IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project Simply.xcodeproj \
            -scheme Simply \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for SideStore
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Simply.app Payload/
          zip -r Simply.ipa Payload
          ls -lh Simply.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simply-IPA
          path: Simply.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating Simply.ipa asset..."
            gh release upload "$TAG" Simply.ipa --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" Simply.ipa \
              --title "Simply v0.1.0" \
              --notes "Prima build di test Simply: schermata grigia pura per verificare apertura e compatibilità SideStore."
          fi
